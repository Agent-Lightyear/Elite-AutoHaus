<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Elite Autohaus | Register</title>
  <link rel="stylesheet" href="login.css">
</head>
<body class="page-body">

  <!-- Background -->
  <div class="page-container register-page">
    <div class="overlay"></div>
<!-- Back button here -->
    <a href="home.html" class="back-home-btn">← Back to Home</a>
    <div class="card register-card">
      <!-- Logo -->
      <div class="logo-wrap">
        <img src="IMG/logo.png" alt="Elite Autohaus Logo" class="logo">
      </div>

      <h2 class="title register-title">Create Account</h2>
      <p class="subtitle">Join the Elite Autohaus family and unlock exclusive benefits.</p>

      <form id="registerForm" class="form register-form">
        <div class="field">
          <label class="label">Full Name</label>
          <input type="text" id="fullName" placeholder="John Doe" required class="input">
        </div>
        <div class="field">
          <label class="label">Email</label>
          <input type="email" id="email" placeholder="you@example.com" required class="input">
        </div>
        <div class="field">
          <label class="label">Phone Number</label>
          <input type="tel" id="phone" placeholder="+91 9876543210" required class="input">
        </div>
        <div class="field">
          <label class="label">Password</label>
          <div class="password-wrap">
            <input type="password" id="password" placeholder="••••••••" required class="input input-password">
            <button type="button" id="togglePassword" class="toggle-btn">
               <img id="togglePasswordIcon" src="IMG/headlight_off.png" class="toggle-icon" alt="toggle password">
            </button>
          </div>
        </div>
        <div class="field">
          <label class="label">Confirm Password</label>
          <div class="password-wrap">
            <input type="password" id="confirmPassword" placeholder="••••••••" required class="input input-password">
            <button type="button" id="toggleConfirmPassword" class="toggle-btn">
               <img id="toggleConfirmPasswordIcon" src="IMG/headlight_off.png" class="toggle-icon" alt="toggle password">
            </button>
          </div>
        </div>
        <button type="submit" class="btn">Register</button>
      </form>
      <div id="recaptcha-container"></div>
      <p class="register-note">
        Already have an account? 
        <a href="login.html" class="register-link">Login</a>
      </p>
    </div>
  </div>

  <!-- Firebase & Firestore -->
 <script type="module">
  import { 
    initializeApp 
  } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

  import { 
    getAuth, 
    createUserWithEmailAndPassword, 
    updateProfile,
    sendEmailVerification,
    RecaptchaVerifier,
    signInWithPhoneNumber
  } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

  import { 
    getFirestore, 
    doc, 
    setDoc, 
    serverTimestamp 
  } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

  // Firebase config
  const firebaseConfig = {
    apiKey: "AIzaSyAMR69VGl2IFav9-P-rwpzaLvZh7WpwFcE",
    authDomain: "elite-autohaus-018s.firebaseapp.com",
    projectId: "elite-autohaus-018s",
    storageBucket: "elite-autohaus-018s.firebasestorage.app",
    messagingSenderId: "374828356950",
    appId: "1:374828356950:web:04abb8bcced3f3ea02f7"
  };

  // Init
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  // Setup invisible reCAPTCHA for phone
  window.recaptchaVerifier = new RecaptchaVerifier(auth, 'recaptcha-container', {
    'size': 'invisible',
    'callback': (response) => {
      console.log("Recaptcha verified");
    }
  });

  // Password toggle functionality
  const passwordInput = document.getElementById('password');
  const togglePassword = document.getElementById('togglePassword');
  const togglePasswordIcon = document.getElementById('togglePasswordIcon');
  
  const confirmPasswordInput = document.getElementById('confirmPassword');
  const toggleConfirmPassword = document.getElementById('toggleConfirmPassword');
  const toggleConfirmPasswordIcon = document.getElementById('toggleConfirmPasswordIcon');

  // Toggle password visibility
  togglePassword.addEventListener('click', () => {
    const type = passwordInput.type === 'password' ? 'text' : 'password';
    passwordInput.type = type;
    togglePasswordIcon.src = type === 'password' ? 'IMG/headlight_off.png' : 'IMG/headlight_on.png';
  });

  // Toggle confirm password visibility
  toggleConfirmPassword.addEventListener('click', () => {
    const type = confirmPasswordInput.type === 'password' ? 'text' : 'password';
    confirmPasswordInput.type = type;
    toggleConfirmPasswordIcon.src = type === 'password' ? 'IMG/headlight_off.png' : 'IMG/headlight_on.png';
  });

  const registerForm = document.getElementById('registerForm');

  registerForm.addEventListener('submit', async (e) => {
    e.preventDefault();

    const fullName = document.getElementById('fullName')?.value.trim();
    const email = document.getElementById('email')?.value.trim();
    const phone = document.getElementById('phone')?.value.trim();
    const password = document.getElementById('password')?.value;
    const confirmPassword = document.getElementById('confirmPassword')?.value;

    if (!fullName || !email || !phone || !password || !confirmPassword) {
      alert("Please fill in all fields!");
      return;
    }

    if (password !== confirmPassword) {
      alert("Passwords do not match!");
      return;
    }

    try {
      // ✅ Create user
      const userCredential = await createUserWithEmailAndPassword(auth, email, password);
      const user = userCredential.user;

      // ✅ Update display name
      await updateProfile(user, { displayName: fullName });

      // ✅ Send email verification
      // await sendEmailVerification(user);
      // alert("📧 Verification email sent! Please check your inbox/spam.");

      // ✅ Save user info in Firestore
      await setDoc(doc(db, "users", user.uid), {
        name: fullName,
        email: email,
        phone: phone,
        createdAt: serverTimestamp()
      });

      // ✅ Send phone OTP
      // const appVerifier = window.recaptchaVerifier;
      // await signInWithPhoneNumber(auth, "+91" + phone, appVerifier) // adjust country code as needed
      //   .then((confirmationResult) => {
      //     window.confirmationResult = confirmationResult;
      //     const otp = prompt("Enter the OTP sent to your phone:");
      //     return confirmationResult.confirm(otp);
      //   })
      //   .then(() => {
      //     alert("📱 Phone number verified successfully!");
      //   })
      //   .catch((error) => {
      //     alert("Phone verification failed: " + error.message);
      //   });

      // ✅ Success message
      registerForm.innerHTML = `
        <p class="text-green-400 text-center font-semibold text-lg">
          ✅ Registration successful! Verify your email before logging in.
        </p>
      `;
      setTimeout(() => {
        window.location.href = "login.html";
      }, 3000);

    } catch (error) {
      if (error.code === 'auth/email-already-in-use') {
        alert("This email is already registered!");
      } else {
        alert(error.message);
      }
    }
  });
</script>

</body>
</html>
