<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coming Soon | Elite AutoHaus</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: "Poppins", sans-serif;
      background: #0f1319;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    .container {
      text-align: center;
      animation: fadeIn 1.2s ease-out forwards;
    }

    .logo {
      height: 120px;
      margin-bottom: 20px;
    }

    h1 {
      font-family: "Playfair Display", serif;
      font-size: 3rem;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .underline {
      width: 120px;
      height: 4px;
      background: #d4af37;
      margin: 0 auto 20px;
      border-radius: 4px;
    }

    p {
      font-size: 1.1rem;
      color: #d1d5db;
      max-width: 420px;
      margin: 10px auto 30px;
      line-height: 1.6;
    }

    .coming-badge {
      display: inline-block;
      padding: 10px 25px;
      border: 2px solid #d4af37;
      border-radius: 999px;
      font-size: 1rem;
      font-weight: 600;
      color: #d4af37;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-top: 20px;
      animation: pulse 1.8s infinite ease-in-out;
    }

    .home-btn {
      display: inline-block;
      margin-top: 35px;
      padding: 12px 26px;
      font-size: 1rem;
      font-weight: 600;
      background: linear-gradient(135deg, #d4af37, #f5e49c);
      color: #111827;
      border-radius: 999px;
      text-decoration: none;
      transition: 0.25s;
    }

    .home-btn:hover {
      background: #0f1319;
      color: #ffffff;
      transform: translateY(-3px) scale(1.03);
      box-shadow: 0 8px 22px rgba(212, 175, 55, 0.4);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.08); opacity: 1; }
      100% { transform: scale(1); opacity: 0.8; }
    }
  </style>
</head>

<body>

  <div class="container">
    <img src="IMG/logo_1.png" alt="Elite AutoHaus Logo" class="logo">

    <h1>Coming Soon</h1>
    <div class="underline"></div>

    <p>
      This feature is currently under development.<br>
      Something premium and exciting is on the way.
    </p>

    <div class="coming-badge">Stay Tuned</div>

    <br>
    <a href="home.html" class="home-btn">Return Home</a>
  </div>

</body>
</html>
