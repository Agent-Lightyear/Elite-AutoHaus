<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Elite Autohaus | Login</title>
  <link rel="stylesheet" href="login.css">
</head>

<body class="page-body">

  <!-- Background / Container -->
  <div class="page-container">

    <!-- Overlay -->
    <div class="overlay"></div>

 <!-- Back button here -->
    <a href="home.html" class="back-home-btn">← Back to Home</a>

    <!-- Card -->
    <div class="card">

      <!-- Logo -->
      <div class="logo-wrap">
        <img src="IMG/logo.png" alt="Elite Autohaus Logo" class="logo">
      </div>

      <h2 class="title">Welcome Back</h2>
      <p class="subtitle">
        Login to continue your journey with
        <span class="brand">Elite Autohaus</span>.
      </p>

      <form id="loginForm" class="form">
        <div class="field">
          <label class="label">Email</label>
          <input type="email" placeholder="you@example.com" required
            class="input input-email">
        </div>

        <div class="field">
          <label class="label">Password</label>
          <div class="password-wrap">
            <input type="password" id="password" placeholder="••••••••" required
              class="input input-password">
            <button type="button" id="togglePassword" class="toggle-btn" aria-label="toggle password">
              <img id="toggleIcon" src="IMG/headlight_off.png" class="toggle-icon" alt="toggle password">
            </button>
          </div>
        </div>

        <div class="controls">
          <label class="remember">
            <input type="checkbox" id="rememberMe" class="checkbox"> Remember Me
          </label>

          <a href="#" id="forgotPasswordLink" class="forgot-link">Forgot Password?</a>
        </div>

        <button type="submit" class="btn">Login</button>
      </form>

      <p class="register-note">
        Don’t have an account?
        <a href="register.html" class="register-link">Register</a>
      </p>

    </div>
  </div>

  <!-- Firebase v12.2.1 -->
  <script type="module">
    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

    import {
      getAuth,
      setPersistence,
      browserLocalPersistence,
      browserSessionPersistence,
      signInWithEmailAndPassword,
      sendPasswordResetEmail
    } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

    import {
      getAnalytics
    } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-analytics.js";

    // Firebase config
    const firebaseConfig = {
      apiKey: "AIzaSyAMR69VGl2IFav9-P-rwpzaLvZh7WpwFcE",
      authDomain: "elite-autohaus-018s.web.app",
      projectId: "elite-autohaus-018s",
      storageBucket: "elite-autohaus-018s.firebasestorage.app",
      messagingSenderId: "374828356950",
      appId: "1:374828356950:web:04abb8bcced3f3ea02f2f7"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const analytics = getAnalytics(app);

    // Elements
    const loginForm = document.getElementById('loginForm');
    const rememberMe = document.getElementById('rememberMe');
    const passwordInput = document.getElementById('password');
    const togglePassword = document.getElementById('togglePassword');
    const toggleIcon = document.getElementById('toggleIcon');
    const forgotPasswordLink = document.getElementById("forgotPasswordLink");

    // Handle Login
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = loginForm.querySelector('input[type="email"]').value.trim();
      const password = passwordInput.value;

      try {
        // Remember me persistence
        const persistence = rememberMe.checked
          ? browserLocalPersistence
          : browserSessionPersistence;

        await setPersistence(auth, persistence);

        const userCredential = await signInWithEmailAndPassword(auth, email, password);
        const user = userCredential.user;

        alert("Login successful!");
        window.location.assign("home.html");

      } catch (err) {
        alert("Login failed: " + err.message);
      }
    });

    // Toggle password visibility
    togglePassword.addEventListener('click', () => {
      const type = passwordInput.type === 'password' ? 'text' : 'password';
      passwordInput.type = type;
      toggleIcon.src = type === 'password' ? 'IMG/headlight_off.png' : 'IMG/headlight_on.png';
    });

    // Forgot Password
    forgotPasswordLink.addEventListener("click", async (e) => {
      e.preventDefault();
      const email = loginForm.querySelector("input[type='email']").value.trim();

      if (!email) {
        alert("⚠️ Please enter your email address first.");
        return;
      }

      try {
        await sendPasswordResetEmail(auth, email);
        alert("📧 Password reset email sent! Please check your inbox (sometimes in Spam).");
      } catch (error) {
        alert("Error: " + error.message);
      }
    });
  </script>
</body>
</html>
