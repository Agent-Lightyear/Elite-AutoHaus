<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elite Autohaus | Account</title>
  <link rel="stylesheet" href="account.css">
  <!-- jsPDF CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

</head>
<body>

  <!-- Navbar -->
  <header>
    <a href="home.html" class="center-logo-link">
      <span>Élite Autohaus</span>
      <img src="IMG/logo_1.png" alt="Elite AutoHaus Logo">
    </a>
    <button id="logoutBtn">Logout</button>
  </header>

  <!-- Account Content -->
  <div class="container">
    <p style="margin-top: 20px; color: #777; margin-bottom: 20px;">
      Welcome to your Élite Autohaus account dashboard.
    </p>

    <img src="IMG/user.png" alt="Profile Picture" class="profile-pic">
    <h2 id="userName">User Name</h2>

    <div class="info">
      <div>
        <label>Name:</label>
        <span id="nameField">User Name</span>
      </div>
      <div>
        <label>Email:</label>
        <span id="emailField">user@example.com</span>
      </div>
      <div>
        <label>Phone:</label>
        <span id="phoneField">+91 9876543210</span>
      </div>
    </div>

    <!-- Purchase History -->
    <div class="purchase-history">
      <h3>Purchase History</h3>
      <ul id="purchaseList">
        <li style="color:#777;">No purchases yet.</li>
      </ul>
    </div>
  </div>

  <!-- Invoice Popup -->
  <div id="invoice-popup" class="popup" style="display:none;">
    <div class="popup-content">
      <h2>Invoice</h2>
      <p><strong>Customer:</strong> <span id="invoice-customer"></span></p>
      <p><strong>Car:</strong> <span id="invoice-car"></span></p>
      <p><strong>Price:</strong> ₹<span id="invoice-price"></span></p>
      <p><strong>Date:</strong> <span id="invoice-date"></span></p>
      <button id="download-pdf">Download PDF</button>
      <button id="close-popup">Close</button>
    </div>
  </div>

  <!-- JS -->
   <!-- jsPDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<!-- autoTable plugin -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>

  <script type="module" src="account.js"></script>
</body>
</html>
