<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Elite Autohaus | Register</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="font-sans bg-gray-900">

  <!-- Background -->
  <div class="relative min-h-screen flex items-center justify-center bg-cover bg-center"
       style="background-image: url('https://images.unsplash.com/photo-1502877338535-766e1452684a?auto=format&fit=crop&w=1650&q=80');">

    <!-- Overlay -->
    <div class="absolute inset-0 bg-black bg-opacity-70"></div>

    <!-- Card -->
    <div class="relative w-full max-w-md bg-gray-900 text-white shadow-2xl rounded-2xl p-10 mx-4">
      <!-- Logo -->
      <div class="flex justify-center mb-6">
        <img src="IMG/logo.png" alt="Elite Autohaus Logo" class="h-12">
      </div>

      <h2 class="text-3xl font-bold mb-2 text-center">Create Account</h2>
      <p class="text-gray-300 mb-6 text-center">Join the Elite Autohaus family and unlock exclusive benefits.</p>

      <form action="#" class="space-y-4">
        <div>
          <label class="block text-sm font-medium">Full Name</label>
          <input type="text" placeholder="John Doe" class="w-full px-4 py-3 rounded-xl border border-gray-700 text-black focus:ring-2 focus:ring-gray-400 focus:outline-none">
        </div>
        <div>
          <label class="block text-sm font-medium">Email</label>
          <input type="email" placeholder="you@example.com" class="w-full px-4 py-3 rounded-xl border border-gray-700 text-black focus:ring-2 focus:ring-gray-400 focus:outline-none">
        </div>
        <div>
          <label class="block text-sm font-medium">Phone Number</label>
          <input type="tel" placeholder="+91 9876543210" class="w-full px-4 py-3 rounded-xl border border-gray-700 text-black focus:ring-2 focus:ring-gray-400 focus:outline-none">
        </div>
        <div>
          <label class="block text-sm font-medium">Password</label>
          <input type="password" placeholder="••••••••" class="w-full px-4 py-3 rounded-xl border border-gray-700 text-black focus:ring-2 focus:ring-gray-400 focus:outline-none">
        </div>
        <div>
          <label class="block text-sm font-medium">Confirm Password</label>
          <input type="password" placeholder="••••••••" class="w-full px-4 py-3 rounded-xl border border-gray-700 text-black focus:ring-2 focus:ring-gray-400 focus:outline-none">
        </div>
        <button class="w-full bg-white text-gray-900 py-3 rounded-xl font-semibold transition hover:bg-[#c9a55b] hover:text-white">Register</button>
</button>
      </form>

      <p class="text-center text-sm text-gray-400 mt-6">
        Already have an account? 
        <a href="login.html" class="text-white font-semibold hover:underline">Login</a>
      </p>
    </div>
  </div>

</body>
</html>
