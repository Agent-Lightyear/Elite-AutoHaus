<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elite Autohaus | Login / Register</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="font-sans bg-gray-900">

  <!-- Background -->
  <div class="relative min-h-screen flex items-center justify-center bg-cover bg-center" 
       style="background-image: url('https://images.unsplash.com/photo-1502877338535-766e1452684a?auto=format&fit=crop&w=1650&q=80');">
    
    <!-- Overlay -->
    <div class="absolute inset-0 bg-black bg-opacity-70"></div>

    <!-- Card -->
    <div class="relative w-full max-w-5xl bg-white shadow-2xl rounded-2xl grid md:grid-cols-2 overflow-hidden">
      
      <!-- Left: Login -->
      <div class="p-10 flex flex-col justify-center">
        <h2 class="text-3xl font-bold text-gray-800 mb-2">Welcome Back</h2>
        <p class="text-gray-500 mb-6">Login to continue your journey with <span class="font-semibold">Elite Autohaus</span>.</p>
        
        <form action="#" class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-gray-700">Email</label>
            <input type="email" placeholder="you@example.com" class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-gray-800 focus:outline-none">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700">Password</label>
            <input type="password" placeholder="••••••••" class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-gray-800 focus:outline-none">
          </div>
          <div class="flex items-center justify-between">
            <label class="flex items-center text-sm text-gray-600">
              <input type="checkbox" class="mr-2"> Remember Me
            </label>
            <a href="#" class="text-sm text-gray-800 hover:underline">Forgot Password?</a>
          </div>
          <button class="w-full bg-gray-900 text-white py-3 rounded-xl hover:bg-gray-800 transition">Login</button>
        </form>
      </div>

      <!-- Right: Register -->
      <div class="bg-gray-900 text-white p-10 flex flex-col justify-center">
        <h2 class="text-3xl font-bold mb-2">Create Account</h2>
        <p class="text-gray-300 mb-6">Join the Elite Autohaus family and unlock exclusive benefits.</p>
        
        <form action="#" class="space-y-4">
          <div>
            <label class="block text-sm font-medium">Full Name</label>
            <input type="text" placeholder="John Doe" class="w-full px-4 py-3 rounded-xl border border-gray-700 text-black focus:ring-2 focus:ring-gray-400 focus:outline-none">
          </div>
          <div>
            <label class="block text-sm font-medium">Email</label>
            <input type="email" placeholder="you@example.com" class="w-full px-4 py-3 rounded-xl border border-gray-700 text-black focus:ring-2 focus:ring-gray-400 focus:outline-none">
          </div>
          <div>
            <label class="block text-sm font-medium">Phone Number</label>
            <input type="tel" placeholder="+91 9876543210" class="w-full px-4 py-3 rounded-xl border border-gray-700 text-black focus:ring-2 focus:ring-gray-400 focus:outline-none">
          </div>
          <div>
            <label class="block text-sm font-medium">Password</label>
            <input type="password" placeholder="••••••••" class="w-full px-4 py-3 rounded-xl border border-gray-700 text-black focus:ring-2 focus:ring-gray-400 focus:outline-none">
          </div>
          <div>
            <label class="block text-sm font-medium">Confirm Password</label>
            <input type="password" placeholder="••••••••" class="w-full px-4 py-3 rounded-xl border border-gray-700 text-black focus:ring-2 focus:ring-gray-400 focus:outline-none">
          </div>
          <button class="w-full bg-white text-gray-900 py-3 rounded-xl font-semibold hover:bg-gray-200 transition">Register</button>
        </form>
        
        <p class="text-xs text-gray-400 mt-4">
          By registering, you agree to our <a href="#" class="underline">Terms & Conditions</a> and <a href="#" class="underline">Privacy Policy</a>.
        </p>
      </div>
    </div>
  </div>

</body>
</html>
