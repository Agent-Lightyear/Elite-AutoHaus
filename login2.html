<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Elite Autohaus | Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="font-sans bg-gray-900">

  <!-- Background -->
  <div class="relative min-h-screen flex items-center justify-center bg-cover bg-center"
       style="background-image: url('https://images.unsplash.com/photo-1502877338535-766e1452684a?auto=format&fit=crop&w=1650&q=80');">

    <!-- Overlay -->
    <div class="absolute inset-0 bg-black bg-opacity-70"></div>

    <!-- Card -->
    <div class="relative w-full max-w-md bg-white shadow-2xl rounded-2xl p-10 mx-4">
      <!-- Logo -->
      <div class="flex justify-center mb-6">
        <img src="IMG/logo.png" alt="Elite Autohaus Logo" class="h-12">
      </div>

      <h2 class="text-3xl font-bold text-gray-800 mb-2 text-center">Welcome Back</h2>
      <p class="text-gray-500 mb-6 text-center">Login to continue your journey with <span class="font-semibold">Elite Autohaus</span>.</p>

      <form action="#" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700">Email</label>
          <input type="email" placeholder="you@example.com" class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-gray-800 focus:outline-none">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700">Password</label>
          <input type="password" placeholder="••••••••" class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-gray-800 focus:outline-none">
        </div>
        <div class="flex items-center justify-between">
          <label class="flex items-center text-sm text-gray-600">
            <input type="checkbox" class="mr-2"> Remember Me
          </label>
          <a href="#" class="text-sm text-gray-800 hover:underline">Forgot Password?</a>
        </div>
       <button class="w-full bg-gray-900 text-white py-3 rounded-xl transition hover:bg-[#c9a55b]">Login </button>
      </form>

      <p class="text-center text-sm text-gray-600 mt-6">
        Don’t have an account? 
        <a href="register.html" class="text-gray-900 font-semibold hover:underline">Register</a>
      </p>
    </div>
  </div>

</body>
</html>
